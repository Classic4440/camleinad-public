name = "camleinad"
compatibility_date = "2024-01-01"

# This project deploys as a Cloudflare Pages static site.
# The entry point is the Vite build output in /dist.
# Run: npx wrangler pages deploy dist --project-name=camleinad

[env.production]
name = "camleinad"

# Pages project configuration
# Site will be available at: https://camleinad.pages.dev
# Custom domain configured in Cloudflare Dashboard:
# camleinad.uwon.workers.dev → point to Pages project "camleinad"
