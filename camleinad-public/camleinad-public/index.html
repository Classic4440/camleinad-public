    (() => {
      let saved = null;
      try { saved = localStorage.getItem('cam-theme'); } catch { saved = null; }
      const theme = ['paper', 'ink', 'mist', 'ember'].includes(saved) ? saved : 'paper';
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.toggle('dark', theme === 'ink' || theme === 'ember');
    })();
  </script>
